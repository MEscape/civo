# ==============================================================================
# CIVO - CONTINUOUS INTEGRATION PIPELINE
# Validates formatting, types, DB contracts, unit/integration/architecture tests,
# license compliance, Next.js build, hardened Docker targets (`migrator` & `runner`),
# and the deploy scripts and proxy configuration for the Oracle host.
# ==============================================================================

name: CI

on:
  pull_request:
  workflow_call:
  # production.yml re-runs the full CI on the exact commit it deploys

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Cancel superseded PR runs; never cancel a run that guards a production deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ----------------------------------------------------------------------------
  # 1. Lint, Format & Component Lock
  # ----------------------------------------------------------------------------
  lint:
    name: Lint & format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: npm run lint
      - run: npm run dead-code
      - run: npm run format:check
      - run: npm run ai-rules:check
      - run: npm run i18n:check
      - run: npm run components:lock

  # ----------------------------------------------------------------------------
  # 2. TypeScript Typecheck
  # ----------------------------------------------------------------------------
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # tsconfig.json includes scripts/ and prisma/, so one run covers them.
      - run: npm run typecheck

  # ----------------------------------------------------------------------------
  # 3. Database Contract & Migrations Verification
  # ----------------------------------------------------------------------------
  database:
    name: Contract & migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: app_ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ci -d app_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci_password@localhost:5432/app_ci
      AUTH_DATABASE_URL: postgresql://ci:ci_password@localhost:5432/app_ci_auth
      AUTH_DATABASE_NAME: app_ci_auth

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Create auth database
        run: |
          PGPASSWORD=ci_password psql \
            -h localhost \
            -U ci \
            -d app_ci \
            -c 'CREATE DATABASE app_ci_auth'

      - name: Migration files are intact
        run: npm run db:migrate:check

      - name: Emitted contract is up to date
        run: |
          npm run db:generate

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are stale. Run 'npm run db:generate' and commit the result."
            git status --short
            git --no-pager diff --stat
            exit 1
          fi

      - name: Apply application migrations
        run: |
          npm run db:migrate:app
          npm run db:migrate:status

      - name: Apply auth migrations
        run: npm run db:migrate:auth

      - name: Database matches the contract
        run: npm run db:verify

  # ----------------------------------------------------------------------------
  # 4. Unit, Integration & Architecture Tests
  # ----------------------------------------------------------------------------
  test:
    name: Unit, integration & architecture tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: app_ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ci -d app_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis-rest:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: ci_rate_limit_token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - "8079:80"

    env:
      DATABASE_URL: postgresql://ci:ci_password@localhost:5432/app_ci
      AUTH_DATABASE_URL: postgresql://ci:ci_password@localhost:5432/app_ci_auth
      AUTH_DATABASE_NAME: app_ci_auth
      AUTH_ENABLED: "false"
      LOG_LEVEL: warn
      RATE_LIMIT_TEST_REST_URL: http://localhost:8079
      RATE_LIMIT_TEST_REST_TOKEN: ci_rate_limit_token
      # The S3 contract tests run against a SeaweedFS started below; these credentials exist only
      # for this job's throwaway container.
      STORAGE_TEST_S3_ENDPOINT: http://localhost:8333
      STORAGE_TEST_S3_ACCESS_KEY_ID: ci-access-key
      STORAGE_TEST_S3_SECRET_ACCESS_KEY: ci-secret-key-0123456789
      STORAGE_TEST_S3_PUBLIC_BUCKET: ci-public
      STORAGE_TEST_S3_PRIVATE_BUCKET: ci-private
      STORAGE_TEST_PUBLIC_BASE_URL: http://localhost:8333/ci-public

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Create auth database
        run: |
          PGPASSWORD=ci_password psql \
            -h localhost \
            -U ci \
            -d app_ci \
            -c 'CREATE DATABASE app_ci_auth'

      - name: Migrate databases
        run: npm run db:migrate

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Wait for the Redis REST proxy
        run: |
          for i in $(seq 1 30); do
            curl -fsS -X POST http://localhost:8079 \
              -H "Authorization: Bearer $RATE_LIMIT_TEST_REST_TOKEN" \
              -H "Content-Type: application/json" \
              -d '["PING"]' && exit 0
            sleep 1
          done
          echo "::error::The Redis REST proxy did not answer."
          exit 1

      # A service container cannot take a config file, so this one is started by hand. It is the
      # same stand-in as docker-compose.yml (SeaweedFS: S3 protocol, path-style addressing, SigV4,
      # anonymous read on the public bucket only), which is what Neon Object Storage looks like to
      # the application.
      - name: Start S3-compatible storage (SeaweedFS)
        run: |
          printf '{"identities":[{"name":"ci","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]},{"name":"anonymous","actions":["Read:%s"]}]}' \
            "$STORAGE_TEST_S3_ACCESS_KEY_ID" "$STORAGE_TEST_S3_SECRET_ACCESS_KEY" "$STORAGE_TEST_S3_PUBLIC_BUCKET" \
            > "$RUNNER_TEMP/s3.json"

          docker run -d --name seaweedfs -p 8333:8333 \
            -v "$RUNNER_TEMP/s3.json:/etc/seaweedfs/s3.json:ro" \
            --entrypoint /bin/sh chrislusf/seaweedfs:latest \
            -c "exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=128 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json"

          # The S3 root answers 403 without credentials once it is up.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$STORAGE_TEST_S3_ENDPOINT/" || true)
            [ "$code" != "000" ] && break
            sleep 1
          done
          if [ "$code" = "000" ]; then
            echo "::error::The S3 storage did not answer."
            docker logs seaweedfs
            exit 1
          fi

          # S3 stores do not create buckets on first write.
          for bucket in "$STORAGE_TEST_S3_PUBLIC_BUCKET" "$STORAGE_TEST_S3_PRIVATE_BUCKET"; do
            docker run --rm --network host \
              -e AWS_ACCESS_KEY_ID="$STORAGE_TEST_S3_ACCESS_KEY_ID" \
              -e AWS_SECRET_ACCESS_KEY="$STORAGE_TEST_S3_SECRET_ACCESS_KEY" \
              -e AWS_DEFAULT_REGION=us-east-1 \
              amazon/aws-cli --endpoint-url "$STORAGE_TEST_S3_ENDPOINT" s3api create-bucket --bucket "$bucket"
          done

      - name: Run integration tests
        run: npm run test:integration

      - name: Run architecture tests
        run: npm run test:architecture

      - name: Run script tests
        run: npm run test:scripts

  # ----------------------------------------------------------------------------
  # 5. License Compliance
  # ----------------------------------------------------------------------------
  license:
    name: License compliance
    uses: ./.github/workflows/license-check.yml
    permissions:
      contents: read
      pull-requests: write

  # ----------------------------------------------------------------------------
  # 6. Next.js Production Build
  # ----------------------------------------------------------------------------
  build:
    name: Next.js build
    needs: [lint, typecheck, database, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_APP_URL: https://ci.example.invalid
      DATABASE_URL: postgresql://ci:ci_password@localhost:5432/app_ci
      AUTH_ENABLED: "true"
      AUTH_SECRET: ci-placeholder-not-a-secret-000000000000
      AUTH_DATABASE_URL: postgresql://ci:ci_password@localhost:5432/app_ci_auth
      MAIL_PROVIDER: smtp
      MAIL_SMTP_HOST: localhost
      MAIL_FROM: ci@example.invalid
      UPSTASH_REDIS_REST_URL: https://ci-placeholder.upstash.invalid
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder-not-a-secret
      RATE_LIMIT_CLIENT_ADDRESS_SOURCE: cloudflare
      STORAGE_S3_ENDPOINT: https://ci-placeholder.storage.invalid
      STORAGE_S3_ACCESS_KEY_ID: ci-placeholder
      STORAGE_S3_SECRET_ACCESS_KEY: ci-placeholder-not-a-secret
      STORAGE_S3_PRIVATE_BUCKET: ci-placeholder

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npm run db:generate
      - run: npm run build

  # ----------------------------------------------------------------------------
  # 7. Docker Image & Hardening Validation (`migrator` + `runner`)
  # ----------------------------------------------------------------------------
  docker:
    name: Docker image validation
    needs: [lint, typecheck, database, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: false
          load: true
          tags: civo-migrator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: civo:ci
          build-args: |
            NEXT_PUBLIC_APP_URL=https://ci.example.invalid
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root user & stripped package managers
        run: |
          test "$(docker run --rm --entrypoint id civo:ci -u)" != "0"
          test "$(docker run --rm --entrypoint id civo-migrator:ci -u)" != "0"
          ! docker run --rm --entrypoint which civo:ci npm

      - name: Create Docker network
        run: docker network create civo-ci

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name civo-postgres-ci \
            --network civo-ci \
            -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=ci \
            -e POSTGRES_PASSWORD=ci_password \
            -e POSTGRES_DB=civo \
            postgres:alpine

          for i in $(seq 1 30); do
            docker exec civo-postgres-ci \
              pg_isready -U ci -d civo && break
            sleep 2
          done

          docker exec civo-postgres-ci \
            psql -U ci -d civo \
            -c 'CREATE DATABASE civo_auth'

      - name: Run database migrations via `migrator` container
        run: |
          docker run --rm \
            --network civo-ci \
            -e DATABASE_URL=postgresql://ci:ci_password@civo-postgres-ci:5432/civo \
            -e AUTH_DATABASE_URL=postgresql://ci:ci_password@civo-postgres-ci:5432/civo_auth \
            -e AUTH_DATABASE_NAME=civo_auth \
            civo-migrator:ci

      - name: Start MailHog
        run: |
          docker run -d \
            --name civo-mailhog-ci \
            --network civo-ci \
            mailhog/mailhog:latest

      - name: Container boots with hardened flags and answers /api/health
        run: |
          docker run -d \
            --init \
            --security-opt=no-new-privileges:true \
            --cap-drop=ALL \
            --name civo-app \
            --network civo-ci \
            -p 3000:3000 \
            -e DATABASE_URL=postgresql://ci:ci_password@civo-postgres-ci:5432/civo \
            -e AUTH_ENABLED=true \
            -e AUTH_SECRET=ci-placeholder-not-a-secret-000000000000 \
            -e AUTH_DATABASE_URL=postgresql://ci:ci_password@civo-postgres-ci:5432/civo_auth \
            -e MAIL_PROVIDER=smtp \
            -e MAIL_SMTP_HOST=civo-mailhog-ci \
            -e MAIL_SMTP_PORT=1025 \
            -e MAIL_FROM=ci@example.invalid \
            -e UPSTASH_REDIS_REST_URL=https://ci-placeholder.upstash.invalid \
            -e UPSTASH_REDIS_REST_TOKEN=ci-placeholder-not-a-secret \
            -e RATE_LIMIT_CLIENT_ADDRESS_SOURCE=cloudflare \
            -e STORAGE_S3_ENDPOINT=https://ci-placeholder.storage.invalid \
            -e STORAGE_S3_ACCESS_KEY_ID=ci-placeholder \
            -e STORAGE_S3_SECRET_ACCESS_KEY=ci-placeholder-not-a-secret \
            -e STORAGE_S3_PRIVATE_BUCKET=ci-placeholder \
            civo:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs civo-app
          exit 1

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker rm -f civo-app civo-mailhog-ci civo-postgres-ci 2>/dev/null || true
          docker network rm civo-ci 2>/dev/null || true

  # ----------------------------------------------------------------------------
  # 8. Deploy Scripts & Edge Configuration (Oracle host)
  # ----------------------------------------------------------------------------
  deploy-config:
    name: Deploy scripts & edge config
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Embedded scripts are not shellchecked here: older steps of this file predate that check.
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color -shellcheck=

      - name: Lint shell scripts
        run: shellcheck -x deploy/bin/civo-remote deploy/host/bootstrap.sh deploy/test/*.sh .github/scripts/*.sh

      - name: Test the deploy key entrypoint
        run: bash deploy/test/civo-remote.test.sh

      - name: Test the Neon branch guards
        run: bash deploy/test/neon-branches.test.sh

      - name: Caddyfile and edge compose file are valid
        run: |
          certs=$(mktemp -d)
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=ci \
            -keyout "$certs/origin.key" -out "$certs/origin.pem"
          cp "$certs/origin.pem" "$certs/cloudflare-origin-pull-ca.pem"
          docker run --rm -e PROD_HOST=app.example.com -e PREVIEW_SUFFIX=example.com \
            -v "$PWD/deploy/edge/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$certs:/certs:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          sudo install -D deploy/host/host.conf.example /opt/civo/etc/host.conf
          docker compose -f deploy/edge/compose.yml config --quiet

  # ----------------------------------------------------------------------------
  # 9. Single Branch Protection Gate
  # ----------------------------------------------------------------------------
  ci-success:
    name: CI success
    if: always()
    needs: [lint, typecheck, database, test, license, build, docker, deploy-config]
    runs-on: ubuntu-24.04

    steps:
      - name: All jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more CI jobs failed or were cancelled."
            exit 1
          fi
