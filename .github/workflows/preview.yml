# ==============================================================================
# CIVO - PREVIEW DEPLOYMENT PIPELINE (Oracle Cloud + Neon branching)
# Every internal pull request gets its own Neon branch (child of the blank `preview-base`) and its own
# container on the Oracle host, served at https://pr-<number>.<PREVIEW_DOMAIN>. A new commit updates
# both in place. preview-cleanup.yml removes them when the pull request closes.
#
# Trust boundary: a pull_request run uses the workflow file of the pull request, so anyone who can
# push a branch here can run code with the `preview` environment's secrets. Those secrets reach
# previews only (the preview SSH key cannot touch production, the Neon branches are not production's).
# Fork pull requests get no secrets and are skipped; pull_request_target is deliberately not used.
# Setup: docs/deployment/neon-branching.md
# ==============================================================================

name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Updates of one pull request run one after the other and are never cancelled midway: a half-applied
# migration or a half-swapped container is worse than a short wait. A newer push replaces a waiting
# run, so the latest commit always wins. The cleanup workflow shares this group.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # 1. Image of the pull request's head commit
  # ----------------------------------------------------------------------------
  image:
    name: Image
    # Fork and Dependabot pull requests receive no secrets, so they are skipped, not failed.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      app-url: https://pr-${{ github.event.pull_request.number }}.${{ vars.PREVIEW_DOMAIN }}

  # ----------------------------------------------------------------------------
  # 2. Neon branch, migrations, container, smoke test, comment
  # ----------------------------------------------------------------------------
  deploy-preview:
    name: Preview
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}.${{ vars.PREVIEW_DOMAIN }}

    permissions:
      contents: read
      packages: read
      pull-requests: write

    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      IMAGE: ${{ needs.image.outputs.image }}
      PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.${{ vars.PREVIEW_DOMAIN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_PARENT_BRANCH: ${{ vars.NEON_PREVIEW_PARENT_BRANCH || 'preview-base' }}
      NEON_DATABASE: ${{ vars.NEON_DATABASE || 'neondb' }}
      NEON_AUTH_DATABASE: ${{ vars.NEON_AUTH_DATABASE || 'civo_auth' }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Generate Prisma client & contracts
        run: npm run db:generate

      # Idempotent: an existing branch of this pull request is reused, not duplicated.
      - name: Neon branch
        id: branch
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}
          parent_branch: ${{ vars.NEON_PREVIEW_PARENT_BRANCH || 'preview-base' }}
          database: ${{ vars.NEON_DATABASE || 'neondb' }}
          role: ${{ vars.NEON_ROLE || 'neondb_owner' }}

      # Refuses anything that is not an unprotected child of the preview base before a single
      # statement runs, so a preview can never migrate or serve the production branch.
      - name: Check the branch and prepare connection strings
        env:
          BRANCH_ID: ${{ steps.branch.outputs.branch_id }}
          DB_URL: ${{ steps.branch.outputs.db_url }}
          DB_URL_POOLED: ${{ steps.branch.outputs.db_url_pooled }}
          DB_PASSWORD: ${{ steps.branch.outputs.password }}
        run: |
          for secret in "$DB_URL" "$DB_URL_POOLED" "$DB_PASSWORD"; do
            [ -n "$secret" ] && echo "::add-mask::$secret"
          done
          bash .github/scripts/neon-branches.sh assert-preview "$PR" "$BRANCH_ID" "$NEON_PARENT_BRANCH"

          # The authentication tables live in a second database of the same branch.
          with_database() {
            URL="$1" DB="$2" node -e 'const u = new URL(process.env.URL); u.pathname = "/" + process.env.DB; console.log(u.href)'
          }
          AUTH_URL=$(with_database "$DB_URL" "$NEON_AUTH_DATABASE")
          AUTH_URL_POOLED=$(with_database "$DB_URL_POOLED" "$NEON_AUTH_DATABASE")
          echo "::add-mask::$AUTH_URL"
          echo "::add-mask::$AUTH_URL_POOLED"
          {
            echo "MIGRATE_DATABASE_URL=$DB_URL"
            echo "MIGRATE_AUTH_DATABASE_URL=$AUTH_URL"
            echo "RUNTIME_DATABASE_URL=$DB_URL_POOLED"
            echo "RUNTIME_AUTH_DATABASE_URL=$AUTH_URL_POOLED"
          } >> "$GITHUB_ENV"

      # The canonical procedure, over the direct (unpooled) connection. A failure stops here: no
      # container is started against a half-migrated branch.
      - name: Migrate the preview branch
        env:
          DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
          AUTH_DATABASE_URL: ${{ env.MIGRATE_AUTH_DATABASE_URL }}
        run: |
          npm run db:migrate:check
          npm run db:migrate

      - uses: ./.github/actions/oci-ssh
        with:
          host: ${{ vars.OCI_HOST }}
          private-key: ${{ secrets.OCI_SSH_KEY }}
          known-hosts: ${{ vars.OCI_SSH_KNOWN_HOSTS }}

      # The registry token and the two database URLs travel on stdin, never in an argument or a log.
      - name: Deploy to the Oracle host
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n%s\nDATABASE_URL=%s\nAUTH_DATABASE_URL=%s\n' \
            "$GITHUB_ACTOR" "$REGISTRY_TOKEN" "$RUNTIME_DATABASE_URL" "$RUNTIME_AUTH_DATABASE_URL" |
            ssh civo-host "deploy-preview $PR $HEAD_SHA $IMAGE"

      - name: Smoke test
        run: |
          for i in $(seq 1 24); do
            if curl -fsS --max-time 10 "$PREVIEW_URL/api/health" | grep -q '"status":"ok"'; then
              echo "Healthy after $i attempt(s)."
              exit 0
            fi
            sleep 5
          done
          echo "::error::$PREVIEW_URL/api/health did not answer ok."
          exit 1

      # One comment per pull request, updated in place.
      - name: Comment the preview URL
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const marker = '<!-- civo-preview -->';
            const sha = process.env.HEAD_SHA.slice(0, 7);
            const ok = process.env.JOB_STATUS === 'success';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = ok
              ? `${marker}\n**Preview:** ${process.env.PREVIEW_URL}\n\nCommit \`${sha}\` · database branch \`preview/pr-${process.env.PR}\``
              : `${marker}\n**Preview failed** for commit \`${sha}\` — [see the run](${run}). The previous preview, if any, is still up.`;
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR);
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
