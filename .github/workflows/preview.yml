name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Older previews of the same PR are obsolete.
# Cancel them when a new commit arrives.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Vercel preview

    # Fork PRs and Dependabot PRs do not receive repository secrets,
    # so skip them rather than failing the deployment.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    environment:
      name: preview

    permissions:
      contents: read
      pull-requests: write

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Pull the Preview environment variables and project settings.
      - name: Pull Vercel preview settings
        run: npx vercel pull --yes --environment=preview

      # Build the exact artifact that will be deployed.
      - name: Build preview
        run: npx vercel build

      # Deploy the artifact built above.
      - name: Deploy preview
        id: deploy
        run: |
          url="$(npx vercel deploy --prebuilt)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Update a single PR comment instead of creating a new comment
      # for every commit pushed to the PR.
      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview -->';
            const body =
              `${marker}\n` +
              `**Preview:** ${process.env.PREVIEW_URL}\n\n` +
              `Commit \`${context.sha.slice(0, 7)}\``;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number,
              }
            );

            const existing = comments.find(
              (comment) => comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
