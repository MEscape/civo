name: Setup Node and install dependencies
description: Pinned Node (from .nvmrc) + lockfile-exact install with a safe npm cache.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        # Caches ~/.npm keyed by package-lock.json. Safe: `npm ci` still installs
        # exactly what the lockfile says and fails if package.json and lockfile disagree.
        cache: npm
    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
