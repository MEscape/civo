name: Feature
description: Suggest a new feature or product capability for Civo
title: "[Feature]: "
labels: ["type:feature", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Keep this focused on one feature that can be built and tested within a few days.
  - type: textarea
    id: problem
    attributes:
      label: Problem / context
      description: What problem does this solve, and who is affected?
      placeholder: Users currently cannot ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should happen? Focus on behavior, not implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this feature to be considered done?
      value: |
        - [ ] The expected behavior works
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: "Optional: note any alternatives worth considering."
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: "Optional: add relevant rules, dependencies, sketches, or links."
    validations:
      required: false
