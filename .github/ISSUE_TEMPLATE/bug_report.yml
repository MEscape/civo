name: Bug
description: Report a bug in Civo
title: "[Bug]: "
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include personal data about children, secrets, or credentials in descriptions, logs, or screenshots.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: What steps reliably reproduce the issue?
      placeholder: |
        1. Go to ...
        2. ...
        3. Observe the issue
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Optional: include relevant version or platform details if they may help reproduce the issue."
      placeholder: |
        - OS / device:
        - Browser / app version:
        - Relevant runtime version:
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: "Optional: add screenshots, logs, or stack traces. Remove personal data, secrets, and credentials."
    validations:
      required: false
