# ==============================================================================
# CIVO - DOCKER COMPOSE CONFIGURATION
# Orchestrates local infrastructure (PostgreSQL, Redis, MailHog) and optional
# production-profile containers (Database Migrator & Next.js App Runner).
# All container environment variables are loaded strictly via `.env.docker`.
# ==============================================================================

name: civo

# ------------------------------------------------------------------------------
# Shared Service Templates (YAML Anchors)
# ------------------------------------------------------------------------------
x-common-env: &common-env
  env_file:
    - .env.docker

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database
  # ----------------------------------------------------------------------------
  postgres:
    <<: *common-env
    image: postgres:alpine
    container_name: civo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - civo-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - civo-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d$$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # MailHog (Local SMTP Server & Web Inbox)
  # ----------------------------------------------------------------------------
  mailhog:
    <<: *common-env
    image: mailhog/mailhog:latest
    container_name: civo-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - civo-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8025/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis (In-Memory Rate-Limit Store)
  # ----------------------------------------------------------------------------
  redis:
    <<: *common-env
    image: redis:alpine
    container_name: civo-redis
    restart: unless-stopped
    volumes:
      - civo-redis-data:/data
    networks:
      - civo-network
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Serverless Redis HTTP Proxy (Upstash REST Emulator)
  # ----------------------------------------------------------------------------
  redis-rest:
    <<: *common-env
    image: hiett/serverless-redis-http:latest
    container_name: civo-redis-rest
    restart: unless-stopped
    ports:
      - "8079:80"
    networks:
      - civo-network
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Database Migrations (One-Off Runner — Production Profile)
  # ----------------------------------------------------------------------------
  migrate:
    <<: *common-env
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: civo-migrate
    restart: "no"
    networks:
      - civo-network
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Next.js Application Server (Production Profile)
  # ----------------------------------------------------------------------------
  app:
    <<: *common-env
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    container_name: civo-app
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    networks:
      - civo-network
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_healthy
      redis-rest:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

# ------------------------------------------------------------------------------
# Networks
# ------------------------------------------------------------------------------
networks:
  civo-network:
    name: civo-network
    driver: bridge

# ------------------------------------------------------------------------------
# Persistent Volumes
# ------------------------------------------------------------------------------
volumes:
  civo-postgres-data:
    name: civo-postgres-data
  civo-redis-data:
    name: civo-redis-data
