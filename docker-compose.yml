# ==============================================================================
# CIVO - LOCAL DEVELOPMENT SERVICES
# Backing services for development and `npm run test:integration` only. The app
# itself is not containerised: production runs on Vercel (Neon, Upstash, Resend).
#
#   npm run infra:up      start (reads `.env.docker`, see `.env.docker.example`)
#   npm run infra:down    stop; add `-- -v` to also delete the database volume
#
# Every port is published on 127.0.0.1 only. Each service receives just the
# variables it needs, interpolated from `.env.docker`, which holds nothing the
# app reads: the app's own settings live in `.env`.
# ==============================================================================

name: civo

x-service: &service
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks:
    - civo-network
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  # PostgreSQL: the application database (`POSTGRES_DB`) plus a second, separate
  # one for authentication (`AUTH_DATABASE_NAME`), mirroring the two Neon databases.
  postgres:
    <<: *service
    image: postgres:18-alpine
    container_name: civo-postgres
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_USER: ${POSTGRES_USER:-civo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker (see .env.docker.example)}
      POSTGRES_DB: ${POSTGRES_DB:-civo}
      AUTH_DATABASE_NAME: ${AUTH_DATABASE_NAME:-civo_auth}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - civo-postgres-data:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MailHog: catches outgoing mail when MAIL_PROVIDER=smtp (web inbox on :8025).
  mailhog:
    <<: *service
    image: mailhog/mailhog:v1.0.1
    container_name: civo-mailhog
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8025/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis behind the REST proxy below. Not published to the host; rate-limit
  # counters are disposable, so nothing is persisted.
  redis:
    <<: *service
    image: redis:8-alpine
    container_name: civo-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Upstash-compatible REST endpoint in front of `redis`, for the same client the
  # app uses in production. Reachable at http://localhost:8079.
  redis-rest:
    <<: *service
    image: hiett/serverless-redis-http:0.0.10
    container_name: civo-redis-rest
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN:?Set SRH_TOKEN in .env.docker (see .env.docker.example)}
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - "127.0.0.1:8079:80"
    depends_on:
      redis:
        condition: service_healthy

networks:
  civo-network:
    name: civo-network

volumes:
  civo-postgres-data:
    name: civo-postgres-data
